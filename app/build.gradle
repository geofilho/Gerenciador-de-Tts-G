plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.geofilho.ttsg'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.geofilho.ttsg'
        minSdk 21
        targetSdk 34
        versionCode 60
        versionName '1.59'
        // Tradutor no aparelho (ML Kit): só as versões para celulares (ARM 64 e 32 bits).
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        gerenciador {
            storeFile file(System.getenv('KEYSTORE') ?: "${System.getProperty('user.home')}/.android/gerenciador-tts-g.keystore")
            storePassword 'android'
            keyAlias 'ttsg'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Mesma chave das versões anteriores: a atualização instala por cima.
            signingConfig signingConfigs.gerenciador
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}


dependencies {
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
}
