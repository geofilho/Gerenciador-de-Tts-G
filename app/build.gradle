plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.geofilho.ttsg'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.geofilho.ttsg'
        minSdk 21
        targetSdk 34
        versionCode 57
        versionName '1.56'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Assina com a chave de depuração para gerar um APK instalável direto.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

// Sem dependências externas: só o framework do Android, para o APK ficar mínimo.
