plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.geofilho.ttsg'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.geofilho.ttsg'
        minSdk 21
        targetSdk 34
        versionCode 91
        versionName '1.90'
    }

    // Tradutor no aparelho (ML Kit): um APK só de 64 bits e um só de 32 bits (a atualização baixa o
    // certo para cada aparelho) e um completo, com os dois, para o link geral e as versões antigas.
    // Sem as versões para computador (x86): o app é para celulares.
    packagingOptions {
        jniLibs {
            excludes += ['lib/x86/**', 'lib/x86_64/**']
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true
        }
    }

    signingConfigs {
        gerenciador {
            storeFile file(System.getenv('KEYSTORE') ?: "${System.getProperty('user.home')}/.android/gerenciador-tts-g.keystore")
            storePassword 'android'
            keyAlias 'ttsg'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Mesma chave das versões anteriores: a atualização instala por cima.
            signingConfig signingConfigs.gerenciador
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}


dependencies {
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
}
