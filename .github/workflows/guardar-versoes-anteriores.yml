name: Guardar versões anteriores

# Roda só quando alguém manda (aba Actions > Guardar versões anteriores > Run workflow).
# Cria na página de versões (Releases) uma publicação para cada versão antiga, da 1.1 à 1.57,
# com o APK e as novidades daquela versão. Não muda a versão mais recente (1.58) nem o
# link de atualização. Versões que já estão na página são puladas.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guardar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Versão 1.1 (primeira)
        run: |
          if gh release view v1.1 >/dev/null 2>&1; then echo "v1.1 já existe"; exit 0; fi
          echo "- Primeira versão: motor de voz, idioma, voz, teste, velocidade, tom, volume, dicionário e voz para emojis." > notas.txt
          gh release create v1.1 atualizacao/versoes-antigas/GerenciadorTtsG-1.1.apk#GerenciadorTtsG.apk \
            --target 29788c31b4c2c9487658c1f8c54624258fa7fb18 \
            --title "Gerenciador de TTS G 1.1" --notes-file notas.txt --latest=false
      - name: Versões 1.2 a 1.57
        run: |
          for c in $(git log --format=%H --reverse -- atualizacao/versao.json); do
            code=$(git show "$c:atualizacao/versao.json" | jq -r .versionCode)
            v=$(git show "$c:atualizacao/versao.json" | jq -r .versionName)
            [ "$code" -lt 59 ] || continue
            if gh release view "v$v" >/dev/null 2>&1; then echo "v$v já existe"; continue; fi
            git show "$c:atualizacao/versao.json" | jq -r .novidades > notas.txt
            mkdir -p apk && git show "$c:atualizacao/GerenciadorTtsG.apk" > apk/GerenciadorTtsG.apk
            gh release create "v$v" apk/GerenciadorTtsG.apk --target "$c" \
              --title "Gerenciador de TTS G $v" --notes-file notas.txt --latest=false
            echo "v$v guardada"
          done
